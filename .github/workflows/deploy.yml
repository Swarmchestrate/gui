name: GUI CI/CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        run: |
          set -e
          printf '%s' '${{ secrets.DOCKERHUB_TOKEN }}' | tr -d '\r\n' | docker login \
            --username '${{ secrets.DOCKERHUB_USERNAME }}' \
            --password-stdin

      - name: Extract metadata
        id: meta
        run: |
          echo "image=${{ secrets.DOCKERHUB_USERNAME }}/gui" >> "$GITHUB_OUTPUT"
          echo "tag_sha=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          echo "tag_latest=latest" >> "$GITHUB_OUTPUT"

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag_latest }}
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag_sha }}

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          GUI_ENV_PRODUCTION_B64: ${{ secrets.GUI_ENV_PRODUCTION_B64 }}
          POSTGREST_API_TOKEN: ${{ secrets.POSTGREST_API_TOKEN }}
        with:
          host: ${{ secrets.GUI_SERVER }}
          username: ${{ secrets.GUI_USER }}
          key: ${{ secrets.GUI_KEY }}
          envs: GUI_ENV_PRODUCTION_B64,POSTGREST_API_TOKEN
          script_stop: false
          script: |
            set -e
            DEPLOY_DIR=/opt/gui
            mkdir -p "$DEPLOY_DIR"
            curl -fsSL "https://raw.githubusercontent.com/Swarmchestrate/gui/${{ github.sha }}/docker-compose.yaml" \
              -o "$DEPLOY_DIR/docker-compose.yaml"
            TMP_ENV="$(mktemp)"
            trap 'rm -f "$TMP_ENV"' EXIT
            printf '%s' "$GUI_ENV_PRODUCTION_B64" | tr -d '\r\n' | base64 -d > "$TMP_ENV"
            printf '\nPOSTGREST_API_TOKEN=%s\n' "$POSTGREST_API_TOKEN" >> "$TMP_ENV"

            if grep -q '^SAT_BUILDER_API_URL=' "$TMP_ENV"; then
              sed -i 's#^SAT_BUILDER_API_URL=.*#SAT_BUILDER_API_URL=http://sat-builder:8000#' "$TMP_ENV"
            else
              printf 'SAT_BUILDER_API_URL=http://sat-builder:8000\n' >> "$TMP_ENV"
            fi

            if grep -q '^GUI_VERSION=' "$TMP_ENV"; then
              sed -i 's#^GUI_VERSION=.*#GUI_VERSION=${{ github.sha }}#' "$TMP_ENV"
            else
              printf 'GUI_VERSION=${{ github.sha }}\n' >> "$TMP_ENV"
            fi

            for required_var in \
              SECRET_KEY \
              DEBUG \
              ALLOWED_HOSTS \
              DATABASE_ENGINE \
              DATABASE_NAME \
              API_URL \
              USE_MOCK_API \
              DOCKER_NAMESPACE \
              GUI_SERVICE_ID \
              GUI_NAME \
              GUI_VERSION \
              GUI_PORT
            do
              if ! grep -q "^${required_var}=" "$TMP_ENV"; then
                echo "Missing required env var: ${required_var}"
                exit 1
              fi
            done

            if grep -q '^SECRET_KEY=#your_secret_key_here$' "$TMP_ENV"; then
              echo "SECRET_KEY is still the placeholder value"
              exit 1
            fi

            mv "$TMP_ENV" "$DEPLOY_DIR/.env"
            chmod 600 "$DEPLOY_DIR/.env"
            cd "$DEPLOY_DIR"
            if [ "${{ secrets.GUI_SUDO }}" = "true" ]; then
              SUDO="sudo -n"
            else
              SUDO=""
            fi
            $SUDO docker network inspect sat-builder-network >/dev/null 2>&1 || \
              $SUDO docker network create --driver bridge sat-builder-network
            $SUDO docker compose pull
            $SUDO docker compose up -d --wait

            IMAGE_REPO="$($SUDO docker compose config --images | head -n 1)"
            IMAGE_REPO="${IMAGE_REPO%:*}"
            KEEP_IMAGES=5
            $SUDO docker image rm "$IMAGE_REPO:latest" >/dev/null 2>&1 || true
            $SUDO docker image ls "$IMAGE_REPO" \
              --format '{{.ID}}\t{{.CreatedAt}}\t{{.Tag}}' | \
              awk -F '\t' '$3 != "latest"' | \
              sort -k2,3r | tail -n +$((KEEP_IMAGES + 1)) | \
              cut -f1 | sort -u | \
              xargs -r -n1 $SUDO docker image rm || true
