<div id="{{ widget.base_id }}" class="d-flex flex-column gap-1 field-wrapper{% if widget.required %} required{% endif %}">
    {% for option in widget.options %}
    <div class="form-check">
        <input
            class="form-check-input"
            type="checkbox"
            name="{{ widget.name }}"
            value="{{ option.value }}"
            id="{{ widget.base_id }}_{{ option.index }}"{% if option.checked %} checked{% endif %}>
        <label class="form-check-label" for="{{ widget.base_id }}_{{ option.index }}">{{ option.label }}</label>
    </div>
    {% endfor %}
</div>
