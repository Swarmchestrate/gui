{% load humanise_swch %}
<div class="border rounded w-100 p-3">
    <div class="empty {% if resource %}d-none{% endif %}">
        <div class="text-center p-4">
            <p class="text-body-secondary">
                A {{ resource_type|humanise_resource_type }} hasn't been specified.
            </p>
            <button
                class="btn btn-light new-dialog-btn"
                type="button"
                data-dialog-id="new-{{ field_name }}-dialog">
                <i class="bi bi-plus-lg"></i>
                Add {{ resource_type|humanise_resource_type|title }}
            </button>
        </div>
    </div>
    <div class="not-empty {% if not resource %}d-none{% endif %}">
        <div class="d-flex flex-md-row flex-column align-items-center column-gap-5 row-gap-4 text-center">
            <dl class="d-flex flex-row flex-wrap justify-content-around column-gap-4 form-text mb-0">
                {% for field in form %}
                <div>
                    <dt>
                        {{ field.label }}
                    </dt>
                    <dd data-field="{{ field.name }}" {% if forloop.last %}class="pb-0"{% endif %}>
                        {% if field.get_choices_display %}
                        {{ field.get_choices_display|default:'Not Set' }}
                        {% else %}
                        {{ field.value|default:'Not Set' }}
                        {% endif %}
                    </dd>
                </div>
                {% endfor %}
            </dl>
            <div class="d-flex column-gap-2 ms-md-auto ms-0">
                <button
                    class="btn btn-light update-dialog-btn"
                    data-dialog-id="update-{{ field_name }}-dialog"
                    type="button"
                    aria-label="Edit"
                    title="Edit">
                    <i class="bi bi-pencil-fill"></i>
                </button>
                <button
                    class="btn btn-outline-danger delete-dialog-btn"
                    data-dialog-id="delete-{{ field_name }}-dialog"
                    type="button"
                    aria-label="Delete"
                    title="Delete">
                    <i class="bi bi-trash3-fill"></i>
                </button>
            </div>
        </div>
    </div>
</div>
